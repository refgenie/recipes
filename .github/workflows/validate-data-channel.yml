name: Validate Data Channel

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'asset_classes/**/*.yaml'
      - 'recipes/**/*.yaml'
      - 'index.yaml'
      - 'data_channel_check.py'
  push:
    branches: [main, master]
    paths:
      - 'asset_classes/**/*.yaml'
      - 'recipes/**/*.yaml'
      - 'index.yaml'
      - 'data_channel_check.py'
  workflow_dispatch:

jobs:
  validate-local:
    name: Validate Local Files
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Validate local data channel
      run: |
        python data_channel_check.py .

    - name: Report validation status
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ Data channel validation passed!"
        else
          echo "❌ Data channel validation failed. Please review the errors above."
          exit 1
        fi

  validate-remote:
    name: Validate Remote API (Optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Validate published data channel
      run: |
        python data_channel_check.py https://refgenie.github.io/recipes/ || echo "::warning::Remote data channel validation found issues. This may be expected if changes haven't been deployed yet."