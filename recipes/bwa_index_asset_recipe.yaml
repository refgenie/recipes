name: bwa_index
version: 0.1.0
output_asset_class: bwa_index
description: Genome index for Burrows-Wheeler Alignment Tool, produced with bwa index
input_files: {}
input_params: {}
input_assets:
  fasta:
    asset_class: fasta
    description: fasta asset for genome
    default: fasta
docker_image: databio/refgenie
command_templates:
  - bwa index -p {{values.output_folder}}/{{values.genome_digest}} {{values.genome_folder}}/{{values.assets["fasta"].seek_keys_dict["fasta"]}}
custom_seek_keys:
  version: "bwa 2>&1 | grep Version | cut -d' ' -f2 | awk -F- '{print $1}'" # uses stderr; monitor https://github.com/lh3/bwa/issues/202
default_asset: "{{values.custom_seek_keys.version}}"
